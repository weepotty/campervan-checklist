# Campervan checklist
#
# Edit this file on GitHub (pencil icon), then "Commit changes".
# The page updates within a minute or two.
#
# Each heading is a section. "items" are your own; "ideas" show with a yellow dot.
# Add a line starting with "- " to add something, delete a line to remove it.
# To add a section, copy a whole block (heading, items, ideas) and rename it.

Van checks:
  items:
    - Water tank filled
    - Enough gas
    - Cutlery - 4x knives, spoons, forks
    - Small cutting knife and scissors
    - Bowls
    - Plates
    - Dishwasher wand - ensure filled
    - Cafetiere
    - Coffee
    - Tea bags
  ideas:
    - Mugs and cups
    - Pots, pan and kettle
    - Lighter or matches
    - Fuel topped up
    - Waste water tank emptied

Extras:
  items:
    - Bin bags
    - Torch
    - Kitchen roll
    - Alcohol gel
    - Portable toilet
  ideas:
    - Phone chargers
    - First aid kit and Calpol
    - Toilet roll
    - Wet wipes

Bedding:
  items:
    - Clean bedding for the top bunk
    - Clean bedding for the bottom bed
    - Pillowcases
  ideas:
    - Sleeping bags and pillows
    - Spare blanket

Food:
  items:
    - Pasta
    - Rice
    - Cornflakes
    - Milk
    - Bread
    - Wraps
    - Jam
    - Peanut butter
    - Apples
    - Oranges
    - Bananas
    - Carrot sticks
    - Fruit
    - Biscuits
    - Marshmallows
    - Skewers
    - Beer/wine
  ideas:
    - Butter
    - Salt, pepper and oil
    - Drinking water

Beach and outdoors:
  items:
    - Wetsuits
    - Towels
    - Swimsuits
    - Crocs
    - Scooters
    - Helmets
  ideas:
    - Suncream
    - Raincoats and fleeces
    - Bucket and spade

Bedtime and kids:
  items:
    - Yoto players
    - Teddies
  ideas:
    - Yoto cards and chargers
    - Books
